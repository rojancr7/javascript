<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <style>
        body{
            background-color: crimson;
            color: black;
        }
        button{
            height: 40px;
            width: 70px;
            border: 2px solid black;
            border-radius: 20px;
            background-color: darkcyan;
            color:white;
            font-size: 18px;
            font-family: 'Times New Roman', Times, serif;
        }
        button:hover{
            cursor: copy;
            border: 3px solid rgb(255, 196, 0);
            border-radius: 22px;
        }
        #number{
            height: 20px;
            width: 20px;
            background-color: cyan;
        }
    </style>
</head>
<body>
    <div class="container">

        <h1>
            Counter Machine.
        </h1>
        <form class="button">
            <h1 id="count">0</h1>
            <button id="add" type="button">Add</button>
            <button id="sub" type="button">Sub</button>
        </form>
    </div>
    <script src="script.js">
        
    </script>
</body>
</html>
