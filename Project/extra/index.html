<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>JavaScript AI Builder</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #111827;
            color: white;
            padding: 30px;
        }

        .app {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .input-area {
            background: #1f2937;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            resize: vertical;
            padding: 15px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: #1f2937;
            border-radius: 12px;
            overflow: hidden;
        }

        .panel-title {
            padding: 12px 15px;
            background: #374151;
            font-weight: bold;
        }

        pre {
            padding: 20px;
            height: 400px;
            overflow: auto;
            color: #d1d5db;
            white-space: pre-wrap;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: none;
            background: white;
        }

    </style>
</head>

<body>

    <div class="app">

        <h1>JavaScript AI Builder</h1>

        <p class="description">
            Describe what you want and JavaScript will create it.
        </p>


        <!-- =====================================================
             USER INPUT
        ====================================================== -->

        <div class="input-area">

            <textarea
                id="prompt"
                placeholder="Example: Create a red button that says Click Me">
            </textarea>

            <button id="generate">
                Generate
            </button>

        </div>


        <!-- =====================================================
             OUTPUT
        ====================================================== -->

        <div class="workspace">

            <div class="panel">

                <div class="panel-title">
                    Generated HTML
                </div>

                <pre id="code">
Your generated HTML will appear here...
                </pre>

            </div>


            <div class="panel">

                <div class="panel-title">
                    Live Preview
                </div>

                <iframe id="preview"></iframe>

            </div>

        </div>

    </div>


    <script>

        // ========================================================
        // SELECT ELEMENTS
        // ========================================================

        const promptInput = document.querySelector('#prompt');

        const generateButton =
            document.querySelector('#generate');

        const codeOutput =
            document.querySelector('#code');

        const preview =
            document.querySelector('#preview');


        // ========================================================
        // GENERATE BUTTON
        // ========================================================

        generateButton.addEventListener('click', function () {

            const prompt = promptInput.value.toLowerCase().trim();

            if (prompt === '') {

                alert('Please describe what you want.');

                return;
            }


            // Generate HTML based on the user's request.

            const html = generateHTML(prompt);


            // Show generated HTML in the code panel.

            codeOutput.textContent = html;


            // Show generated HTML inside iframe.

            preview.srcdoc = html;

        });


        // ========================================================
        // SIMPLE HTML GENERATOR
        // ========================================================

        function generateHTML(prompt) {

            // ----------------------------------------------------
            // BUTTON
            // ----------------------------------------------------

            if (prompt.includes('button')) {

                let buttonText = 'Click Me';

                if (prompt.includes('login')) {
                    buttonText = 'Login';
                }

                if (prompt.includes('submit')) {
                    buttonText = 'Submit';
                }

                if (prompt.includes('click me')) {
                    buttonText = 'Click Me';
                }


                let color = '#6366f1';

                if (prompt.includes('red')) {
                    color = 'red';
                }

                if (prompt.includes('blue')) {
                    color = 'blue';
                }

                if (prompt.includes('green')) {
                    color = 'green';
                }


                return `
<!DOCTYPE html>

<html>

<head>

<style>

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

button {

    background: ${color};

    color: white;

    border: none;

    padding: 15px 30px;

    border-radius: 8px;

    font-size: 18px;

    cursor: pointer;
}

</style>

</head>

<body>

<button onclick="alert('Button clicked!')">
    ${buttonText}
</button>

</body>

</html>
                `;

            }


            // ----------------------------------------------------
            // HEADING
            // ----------------------------------------------------

            if (prompt.includes('heading')) {

                return `
<!DOCTYPE html>

<html>

<body>

<h1 style="
    text-align:center;
    margin-top:100px;
">

Hello World

</h1>

</body>

</html>
                `;

            }


            // ----------------------------------------------------
            // CARD
            // ----------------------------------------------------

            if (prompt.includes('card')) {

                return `
<!DOCTYPE html>

<html>

<head>

<style>

body {

    background: #f3f4f6;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

}

.card {

    background: white;

    padding: 30px;

    border-radius: 15px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.15);

    text-align: center;

    width: 300px;

}

</style>

</head>

<body>

<div class="card">

    <h2>My Card</h2>

    <p>
        This card was generated
        using JavaScript.
    </p>

    <button>
        Learn More
    </button>

</div>

</body>

</html>
                `;

            }


            // ----------------------------------------------------
            // DEFAULT
            // ----------------------------------------------------

            return `
<!DOCTYPE html>

<html>

<body>

<h1>
    I don't understand that request yet.
</h1>

<p>
    Try asking for a button, card, or heading.
</p>

</body>

</html>
            `;
        }

    </script>

</body>

</html>
